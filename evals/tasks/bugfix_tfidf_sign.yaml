task_id: bugfix_tfidf_sign
category: bug_fix
source_dir: ../fixtures/textstats
goal: >
  The textstats test suite fails. Find the bug and fix the implementation so that `python -m pytest -q` passes.
  Do not modify the tests.
inputs:
  repo: "."
  command: "python -m pytest -q --no-header -p no:cacheprovider"
success_criteria: pytest exits 0 with all 12 tests passing; no file under tests/ is modified.
inject:
  file: textstats/stats.py
  old: "math.log(n_docs / df[t])"
  new: "math.log(df[t] / n_docs)"
bug_note: IDF inverted - log(df/N) instead of log(N/df)
check:
  - type: tests_pass
    command: "python -m pytest -q --no-header -p no:cacheprovider"
    protected: [tests, conftest.py]
