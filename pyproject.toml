[project]
name = "reproagent"
version = "0.1.0"
description = "A controllable, reproducible agent for research-code reproduction tasks: state-machine orchestration, schema tools, sandboxed execution, and offline evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "litellm>=1.50",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pypdf>=4.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-timeout>=2.3", "ruff>=0.5"]

[project.scripts]
reproagent = "reproagent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reproagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501", "UP042", "E731"]
